<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Reisebegleiter</title>
  <meta name="description" content="PersÃ¶nliche Reise-Assistenz mit Echtzeit-Verbindungen">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reise">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
  <header class="topbar">
    <div class="brand"><button id="drawerBtn" class="iconbtn" aria-label="Ãœbersicht" onclick="openDrawer()"><svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button><span id="screenTitle">Jetzt</span></div>
    <div class="topstatus">
      <span id="gpsBadge" class="badge muted" title="GPS">GPS aus</span>
      <span id="liveBadge" class="badge muted" title="Live-Abgleich">Live aus</span>
      <button id="settingsBtn" class="iconbtn" aria-label="Einstellungen"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z"/></svg></button>
    </div>
  </header>
  <!-- Live-Leiste: Status der Reise auf jedem Bildschirm (Vorstufe zur Dynamic Island) -->
  <button id="liveBar" class="livebar hidden"></button>

  <main id="app">
    <!-- JETZT -->
    <section id="view-jetzt" class="view active"></section>
    <!-- PLAN -->
    <section id="view-plan" class="view"></section>
    <!-- KOSTEN -->
    <section id="view-kosten" class="view"></section>
    <!-- ASSISTENT -->
    <section id="view-assist" class="view"></section>
    <!-- MEHR -->
    <section id="view-mehr" class="view"></section>
  </main>

  <nav class="tabbar">
    <button data-view="jetzt" class="active"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span>Jetzt</span></button>
    <button data-view="plan"><svg viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2zM5 9h14v11H5z"/></svg><span>Plan</span></button>
    <button id="addBtn" class="add" aria-label="Neu eintragen"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button>
    <button data-view="kosten"><svg viewBox="0 0 24 24"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2zm3 5v2h6V7zm0 4v2h6v-2zm0 4v2h4v-2z"/></svg><span>Kosten</span></button>
    <button data-view="assist"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H7l-3 3zm4 5v2h2V9zm4 0v2h2V9zm4 0v2h2V9z"/></svg><span>Assistenz</span><i id="feedDot" class="dot hidden"></i></button>
  </nav>

  <!-- Assistenz-Bubble: erscheint Ã¼ber jedem Bildschirm, wenn etwas Relevantes passiert -->
  <button id="buddy" class="buddy hidden" aria-label="Assistenz">âœ¦</button>
  <div id="buddyBubble" class="buddy-bubble hidden"></div>

  <!-- Bottom sheet -->
  <div id="sheetBackdrop" class="backdrop hidden"></div>
  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-head" id="sheetHead">
      <button id="sheetBack" class="btn ghost sm hidden" onclick="backSheet()">â€¹ ZurÃ¼ck</button>
      <div class="grabber"></div>
      <button id="sheetClose" class="btn ghost sm" onclick="closeSheet()" aria-label="Abbrechen">Abbrechen</button>
    </div>
    <div id="sheetBody"></div>
  </div>

  <!-- Seitenfenster: Ãœbersicht Ã¼ber Planung, Verlauf und Orte -->
  <div id="drawerBackdrop" class="backdrop hidden" onclick="closeDrawer()"></div>
  <aside id="drawer" class="drawer hidden" aria-label="Ãœbersicht"></aside>

  <div id="toast" class="toast hidden"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js?v=11"></script>
  <script src="costs.js?v=11"></script>
  <script src="guide.js?v=11"></script>
  <script src="archive.js?v=11"></script>
  <script src="preplan.js?v=11"></script>
  <script src="ridefind.js?v=11"></script>
  <script src="trip.js?v=11"></script>
  <script src="followup.js?v=11"></script>
  <script src="hotel.js?v=11"></script>
  <script src="nav.js?v=11"></script>
</body>
</html>
